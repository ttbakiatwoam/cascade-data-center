name: Publish research website

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'proposals/**'
      - 'dataset/policy/**'
      - 'scripts/export_research_pdfs.py'
      - 'scripts/requirements-pdf.txt'
      - 'scripts/build_m2_concordance.py'
      - 'scripts/build_nov9_committee_packet.py'
      - 'scripts/build_m2_full_redline.py'
      - 'scripts/build_m2_nov11_redblue.py'
      - 'scripts/requirements-m2.txt'
      - 'sources/cascade-zoning/Entire zoning code-1.pdf'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF rendering dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core libpango-1.0-0 libpangocairo-1.0-0 libharfbuzz0b
          python -m pip install -r scripts/requirements-m2.txt
      # The historical November 3-9 PDFs remain versioned and untouched. Their
      # older export validator rejects other PDFs already in downloads. Publish
      # only the active November 11 red/blue source on routine site builds.
      - name: Render November 11 draft ordinance PDF with reported voted definitions
        run: python scripts/build_m2_nov11_redblue.py --root . --out docs/downloads
      - name: Commit reproducibly generated PDFs to the repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/downloads/*.pdf
          if git diff --cached --quiet; then
            echo 'Generated PDF files are already current.'
          else
            git commit -m 'docs: publish verified Nov 11 red blue and historical committee PDFs [skip ci]'
            git push origin HEAD:master
          fi
      - name: Archive current draft and historical downloadable PDFs
        uses: actions/upload-artifact@v4
        with:
          name: cascade-published-research-pdfs-full-redline-and-original-m2-concordance
          path: docs/downloads/*.pdf
          retention-days: 90
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build site with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
