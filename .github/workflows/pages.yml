name: Publish research website

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'proposals/**'
      - 'dataset/policy/**'
      - 'scripts/export_research_pdfs.py'
      - 'scripts/requirements-pdf.txt'
      - 'scripts/build_m2_concordance.py'
      - 'scripts/build_nov9_committee_packet.py'
      - 'scripts/build_m2_full_redline.py'
      - 'scripts/requirements-m2.txt'
      - 'sources/cascade-zoning/Entire zoning code-1.pdf'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF rendering dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core libpango-1.0-0 libpangocairo-1.0-0 libharfbuzz0b
          python -m pip install -r scripts/requirements-m2.txt
      - name: Export cited research PDFs
        run: python scripts/export_research_pdfs.py --root . --out docs/downloads
      - name: Render full black/red/blue M-2 text with unchanged scan appendix
        run: python scripts/build_m2_full_redline.py --root . --out docs/downloads
      - name: Build original M-2 scanned ordinance and highlighted concordance
        run: python scripts/build_m2_concordance.py --root . --out docs/downloads
      - name: Assemble November 9 consolidated committee packet and corrected companion PDFs
        run: python scripts/build_nov9_committee_packet.py --out docs/downloads
      - name: Commit reproducibly generated PDFs to the repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/downloads/*.pdf
          if git diff --cached --quiet; then
            echo 'Generated PDF files are already current.'
          else
            git commit -m 'docs: publish verified November 9 committee PDFs [skip ci]'
            git push origin HEAD:master
          fi
      - name: Archive published PDF packets, color redline and scan comparison
        uses: actions/upload-artifact@v4
        with:
          name: cascade-published-research-pdfs-full-redline-and-original-m2-concordance
          path: docs/downloads/*.pdf
          retention-days: 90
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build site with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
