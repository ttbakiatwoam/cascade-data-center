name: Build November 18 committee packet

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'scripts/build_nov18_meeting_packet.py'
      - 'proposals/NOVEMBER-18-2026-GENERATORS-AIR-AND-IOWA-CITY-COMPARATORS.md'
      - 'proposals/COMPLETE-M2-COLOR-CODED-REDLINE-2026-11-11.md'
      - 'dataset/policy/38_IOWA_STATE_AND_M2_DEFINITIONS_2026-11-03.md'
      - '.github/workflows/build-nov18-meeting-packet.yml'

permissions:
  contents: write

concurrency:
  group: nov18-committee-packet
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest master
        uses: actions/checkout@v6
        with:
          ref: master
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core libpango-1.0-0 libpangocairo-1.0-0 libharfbuzz0b
          python -m pip install -r scripts/requirements-m2.txt requests
      - name: Build 18 November full packet
        run: |
          python scripts/build_nov18_meeting_packet.py --root . --out docs/downloads/cascade-advisory-committee-meeting-packet-2026-11-18.pdf
      - name: Check PDF
        run: |
          python - <<'PY'
          import fitz
          p='docs/downloads/cascade-advisory-committee-meeting-packet-2026-11-18.pdf'
          with fitz.open(p) as d:
              assert len(d) >= 55, len(d)
              full='\n'.join(page.get_text() for page in d)
              for phrase in ['November 18, 2026','28 proposed','Central City','15 ppm','100,000 square feet or larger','Electrical demand exceeding 60 megawatts']:
                  assert phrase in full, phrase
              print('Validated packet',len(d),'pages')
          PY
      - name: Commit generated packet, retry safe on concurrent edits
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/downloads/cascade-advisory-committee-meeting-packet-2026-11-18.pdf
          if git diff --cached --quiet; then
            echo 'Committee packet unchanged.'
            exit 0
          fi
          git commit -m 'docs: publish 18 November committee research packet [skip ci]'
          for attempt in 1 2 3; do
            if git push origin HEAD:master; then exit 0; fi
            git fetch origin master
            git rebase origin/master
          done
          echo 'Failed to publish packet after retries' >&2
          exit 1
      - name: Archive packet
        uses: actions/upload-artifact@v4
        with:
          name: cascade-nov18-committee-packet
          path: docs/downloads/cascade-advisory-committee-meeting-packet-2026-11-18.pdf
          retention-days: 90
