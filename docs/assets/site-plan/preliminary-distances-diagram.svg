<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 660" role="img" aria-labelledby="title desc">
<title id="title">Preliminary distances from the proposed Cascade data center to nearby homes</title>
<desc id="desc">Horizontal geometry uses 400.5 feet between the Simple Mining east lot line and residential lot line. Approximate eastmost facility to nearest roofline measurements are 610 feet for cooling, 640 feet for electrical, 670 feet for the main building and 1020 feet for the substation. This is an approximate interpretation of preliminary plan and aerial, not a survey.</desc>
