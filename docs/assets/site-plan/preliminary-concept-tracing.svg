<title id="title">Illustrative tracing of the September 25 2026 Simple Mining site concept</title>
<desc id="desc">Site concept showing Industrial Street access on the west, regional basin on the northwest, substation southwest, rectangular main building, cooling yard north, electrical yard south, drive loop, and an eastern tree row.</desc>
